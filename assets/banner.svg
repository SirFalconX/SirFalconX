<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="SirFalconX - Space Cowboy Game Dev">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0b1a"/><stop offset=".55" stop-color="#1a1040"/><stop offset="1" stop-color="#3a0f3a"/>
  </linearGradient>
  <radialGradient id="planet" cx=".35" cy=".35" r=".8">
    <stop offset="0" stop-color="#ff9f43"/><stop offset=".6" stop-color="#e63946"/><stop offset="1" stop-color="#5b1233"/>
  </radialGradient>
  <linearGradient id="trail" x1="0" x2="1">
    <stop offset="0" stop-color="#4ecdc4" stop-opacity="0"/><stop offset="1" stop-color="#f5c518" stop-opacity=".9"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.5" fill="#000" opacity=".22"/>
  </pattern>
  <clipPath id="frame"><rect x="14" y="14" width="1172" height="292" rx="6"/></clipPath>
</defs>
<style>
  .tw{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  .ship{animation:fly 11s linear infinite}
  @keyframes fly{0%{transform:translate(-260px,215px) rotate(-4deg)}50%{transform:translate(620px,150px) rotate(2deg)}100%{transform:translate(1420px,80px) rotate(-3deg)}}
  .ring{transform-origin:1010px 150px;animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .float{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .gA{animation:gA 3.2s steps(1) infinite}
  .gB{animation:gB 3.2s steps(1) infinite}
  @keyframes gA{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-5px,1px)}96%{transform:translate(4px,-1px)}}
  @keyframes gB{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(5px,-1px)}96%{transform:translate(-4px,1px)}}
  .blink{animation:bl 1.2s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .title{font-family:'Arial Black','Impact','Segoe UI',sans-serif;font-weight:900;font-style:italic;font-size:92px;letter-spacing:2px}
  .mono{font-family:'Courier New',ui-monospace,monospace;font-weight:700}
</style>
