<style>
:root{--brass:#d4a24a;--green:#39ff7a;--cream:#f1e3c4}
*{box-sizing:border-box;margin:0}

body{background:radial-gradient(circle at 50% 40%,#2a180d,#0e0805);color:var(--cream);font-family:'Courier New',monospace;display:grid;place-items:center;overflow:hidden}
main{width:min(100vw,1500px);padding:12px}

.hint{text-align:center;margin-top:14px;letter-spacing:.2em;font-size:clamp(.65rem,1.4vw,.9rem);color:var(--brass)}
.hint b{color:var(--green)}

<script>
const svg=document.querySelector('svg');
const head=document.getElementById('head'),far=document.getElementById('p-far'),mid=document.getElementById('p-mid'),road=document.getElementById('p-road');
let tx=0,ty=0,cx=0,cy=0;
function pt(e){const t=e.touches?e.touches[0]:e;const p=svg.createSVGPoint();p.x=t.clientX;p.y=t.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function move(e){const p=pt(e);tx=(p.x-600)/600;const ang=Math.atan2(p.y-140,p.x-768)*180/Math.PI;ty=Math.max(-28,Math.min(28,ang*.45))}
addEventListener('mousemove',move);addEventListener('touchmove',move,{passive:true});
(function loop(){cx+=(tx-cx)*.08;
 head.setAttribute('transform','rotate('+(ty*.8)+' 768 172)');
 far.setAttribute('transform','translate('+(cx*-8)+' 0)');
 mid.setAttribute('transform','translate('+(cx*-20)+' 0)');
 road.setAttribute('transform','translate('+(cx*-34)+' 0)');
 requestAnimationFrame(loop)})();
function pothole(){
 document.getElementById('shake').animate([{transform:'translateY(0)'},{transform:'translateY(-16px)'},{transform:'translateY(5px)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:650,easing:'ease-out'});
 document.getElementById('jump').animate([{transform:'translateY(0)'},{transform:'translateY(-26px)'},{transform:'translateY(8px)'},{transform:'translateY(-4px)'},{transform:'translateY(0)'}],{duration:800,easing:'ease-out'});
}
addEventListener('click',pothole);addEventListener('touchstart',pothole,{passive:true});
</script></body></html>
